name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: 1.3.4

      - name: Install Node dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Run tests with coverage and check threshold
        run: |
          # Run tests with coverage once and capture output
          COVERAGE_OUTPUT=$(bun test --coverage ./src 2>&1)
          echo "$COVERAGE_OUTPUT"

          # Extract coverage percentage from "All files" line
          COVERAGE=$(echo "$COVERAGE_OUTPUT" | grep "All files" | awk '{print $4}' | sed 's/%//')
          echo "Frontend coverage: $COVERAGE%"

          if [ -z "$COVERAGE" ]; then
            echo "❌ Could not parse coverage output"
            exit 1
          fi

          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Frontend coverage ($COVERAGE%) is below 80% threshold"
            exit 1
          fi
          echo "✅ Frontend coverage ($COVERAGE%) meets 80% threshold"

      - name: Lint frontend
        run: bunx eslint . --ext .js,.ts,.tsx

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Build Rust backend
        run: cargo build --release
        working-directory: src-tauri

      - name: Run tests with coverage and check threshold
        run: |
          # Run coverage once and capture output (this also runs tests)
          COVERAGE_OUTPUT=$(cargo llvm-cov --all-features --workspace 2>&1)
          echo "$COVERAGE_OUTPUT"

          # Extract coverage from TOTAL line, using the region coverage (more reliable)
          # Format: TOTAL [regions]  X.XX%  [functions]  Y.YY%  [lines]  Z.ZZ%
          COVERAGE=$(echo "$COVERAGE_OUTPUT" | grep "TOTAL" | awk '{for(i=1;i<=NF;i++) if($i ~ /[0-9]+\.[0-9]+%/) {print $i; exit}}' | sed 's/%//')
          echo "Rust coverage: $COVERAGE%"

          if [ -z "$COVERAGE" ]; then
            echo "❌ Could not parse coverage output"
            exit 1
          fi

          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Rust coverage ($COVERAGE%) is below 80% threshold"
            exit 1
          fi
          echo "✅ Rust coverage ($COVERAGE%) meets 80% threshold"
        working-directory: src-tauri

      - name: Lint Rust code (clippy)
        run: cargo clippy --release -- -D warnings
        working-directory: src-tauri
